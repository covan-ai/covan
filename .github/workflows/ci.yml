name: CI

# `pull_request`, not `pull_request_target`. The difference matters here: this
# repo takes contributions from forks, and `pull_request_target` would run that
# code with a write-scoped token and access to repository secrets. Nothing in
# this workflow needs a secret — the tests bring their own database — so there
# is no reason to reach for it.
on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Any job needing more should ask for it explicitly.
permissions:
  contents: read

# A branch that gets three pushes in a minute should spend CI on the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, and before anything is installed. The checker is dependency-free
      # on purpose, so the highest-consequence mistake in the repo — a table
      # created without RLS, which the public anon key can then read and write —
      # is reported in seconds rather than after a full install and a database.
      - name: Row level security is enabled on every table
        run: node scripts/check-rls.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'worker/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile: a pull request that quietly changes a dependency
      # version without committing the lockfile fails here rather than being
      # installed.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: worker

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck
        working-directory: worker

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'worker/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: worker

      - name: Frontend
        run: bun run test
      - name: API
        run: bun run test
        working-directory: worker

  self-host:
    name: The self-host build boots
    runs-on: ubuntu-latest
    # The job that would have caught #101 on the day it landed instead of nine
    # days and 229 commits later.
    #
    # Everything else here reads source. This builds the artifact a self-hoster
    # runs and asks it for four pages, because the bug was in neither the source
    # nor the tests — it was in how the bundler chunked a graph that every other
    # check was perfectly happy with. Lint, types, 1,647 unit tests and the RLS
    # suite were all green the entire time the product answered 500 on every
    # route it had.
    #
    # `node-server` is the preset `Dockerfile.web` sets. The hosted site builds
    # `cloudflare-module` and was unaffected throughout, which is most of how
    # this went unnoticed: the deployment anybody was watching was fine.
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'worker/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build it the way Dockerfile.web does
        # Sentinels, for the same reason Dockerfile.web uses them: Vite inlines
        # VITE_* as literal strings at build time, and nothing here should carry
        # a real project's values. `.invalid` is reserved by RFC 2606 and can
        # never resolve, so a page that somehow tried to reach one fails at once
        # rather than reaching somebody else's server.
        run: bun run build
        env:
          NITRO_PRESET: node-server
          VITE_SUPABASE_URL: https://covan-ci-supabase-url.invalid
          VITE_SUPABASE_ANON_KEY: covan-ci-anon-key
          VITE_API_URL: https://covan-ci-api-url.invalid

      - name: Serve four pages from it
        run: node scripts/check-self-host.mjs

  rls:
    name: Row level security
    runs-on: ubuntu-latest
    # Slower than the other two by an order of magnitude, because it boots a
    # real Postgres and applies every migration. Kept as its own job so a
    # failing lint reports in seconds instead of waiting behind it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'worker/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The repo's own compose stack rather than `supabase start`. Two reasons:
      # it is the stack self-hosters actually run, so this job doubles as a
      # check that it still comes up; and its service list is pinned here in
      # docker-compose.yml rather than moving with a CLI release.
      - name: Configure the stack
        run: |
          cp .env.docker.example .env
          # docker compose interpolates the whole file even when only some
          # services are named, and the API service declares OPENAI_API_KEY as
          # required. No test makes a model call.
          printf '\nOPENAI_API_KEY=unused-by-these-tests\n' >> .env

      # Only the four services the suite needs: Postgres for the schema, GoTrue
      # to mint real user tokens, PostgREST to serve them, Kong in front. The
      # API, the web app and Realtime are never touched.
      - name: Start Postgres, GoTrue, PostgREST and Kong
        run: docker compose up -d --wait db auth rest kong

      # A separate step so a migration that fails to apply is reported as
      # exactly that, rather than as a suite of failing tests.
      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Run the suite
        run: |
          set -a && . ./.env && set +a
          SUPABASE_TEST_URL="http://localhost:${KONG_HTTP_PORT:-8000}" \
          SUPABASE_TEST_ANON_KEY="$ANON_KEY" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_TEST_DB_URL="postgresql://postgres:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT:-54322}/postgres" \
          bun run test:rls

      - name: Show what the database said, if anything failed
        if: failure()
        run: docker compose logs --tail 100 db auth rest

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
